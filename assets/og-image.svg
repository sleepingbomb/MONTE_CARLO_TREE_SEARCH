<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#12121a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f0ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0066ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff00aa;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Grid pattern -->
  <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
    <path d="M 50 0 L 0 0 0 50" fill="none" stroke="rgba(0,240,255,0.05)" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>
  
  <!-- Tree visualization -->
  <g transform="translate(900, 100)">
    <line x1="100" y1="50" x2="50" y2="150" stroke="rgba(0,240,255,0.3)" stroke-width="3"/>
    <line x1="100" y1="50" x2="150" y2="150" stroke="rgba(0,240,255,0.3)" stroke-width="3"/>
    <line x1="50" y1="150" x2="25" y2="250" stroke="rgba(0,240,255,0.2)" stroke-width="2"/>
    <line x1="50" y1="150" x2="75" y2="250" stroke="rgba(0,240,255,0.2)" stroke-width="2"/>
    <line x1="150" y1="150" x2="125" y2="250" stroke="rgba(0,240,255,0.2)" stroke-width="2"/>
    <line x1="150" y1="150" x2="175" y2="250" stroke="rgba(0,240,255,0.2)" stroke-width="2"/>
    
    <circle cx="100" cy="50" r="20" fill="#ff00aa"/>
    <circle cx="50" cy="150" r="15" fill="#00f0ff"/>
    <circle cx="150" cy="150" r="15" fill="#00f0ff"/>
    <circle cx="25" cy="250" r="10" fill="#00f0ff"/>
    <circle cx="75" cy="250" r="10" fill="#f0ff00"/>
    <circle cx="125" cy="250" r="10" fill="#00f0ff"/>
    <circle cx="175" cy="250" r="10" fill="#00f0ff"/>
  </g>
  
  <!-- Text content -->
  <text x="80" y="200" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="white">Monte Carlo</text>
  <text x="80" y="290" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="url(#textGrad)">Tree Search</text>
  
  <text x="80" y="380" font-family="Arial, sans-serif" font-size="24" fill="#8888aa">MCTS-DRL for Robotic Navigation</text>
  
  <!-- Footer -->
  <text x="80" y="550" font-family="Arial, sans-serif" font-size="20" fill="#555566">Team 14 • Arizona State University • EEE598 Fall 2024</text>
  
  <!-- Accent line -->
  <rect x="80" y="420" width="200" height="4" fill="url(#textGrad)"/>
</svg>
