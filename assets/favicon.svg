<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f0ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0066ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff00aa;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="100" height="100" rx="20" fill="#0a0a0f"/>
  
  <!-- Tree structure -->
  <!-- Lines -->
  <line x1="50" y1="20" x2="25" y2="45" stroke="url(#grad)" stroke-width="2" opacity="0.5"/>
  <line x1="50" y1="20" x2="75" y2="45" stroke="url(#grad)" stroke-width="2" opacity="0.5"/>
  <line x1="25" y1="45" x2="15" y2="70" stroke="url(#grad)" stroke-width="2" opacity="0.3"/>
  <line x1="25" y1="45" x2="35" y2="70" stroke="url(#grad)" stroke-width="2" opacity="0.3"/>
  <line x1="75" y1="45" x2="65" y2="70" stroke="url(#grad)" stroke-width="2" opacity="0.3"/>
  <line x1="75" y1="45" x2="85" y2="70" stroke="url(#grad)" stroke-width="2" opacity="0.3"/>
  
  <!-- Root node -->
  <circle cx="50" cy="20" r="8" fill="#ff00aa"/>
  <circle cx="50" cy="20" r="4" fill="#0a0a0f"/>
  
  <!-- Level 1 nodes -->
  <circle cx="25" cy="45" r="6" fill="#00f0ff"/>
  <circle cx="25" cy="45" r="3" fill="#0a0a0f"/>
  <circle cx="75" cy="45" r="6" fill="#00f0ff"/>
  <circle cx="75" cy="45" r="3" fill="#0a0a0f"/>
  
  <!-- Level 2 nodes -->
  <circle cx="15" cy="70" r="4" fill="#00f0ff"/>
  <circle cx="35" cy="70" r="4" fill="#f0ff00"/>
  <circle cx="65" cy="70" r="4" fill="#00f0ff"/>
  <circle cx="85" cy="70" r="4" fill="#00f0ff"/>
  
  <!-- Text -->
  <text x="50" y="92" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="url(#grad)" text-anchor="middle">MCTS</text>
</svg>
